<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>2026年高考祝福弹幕</title>
    <style>
        :root {
            --brick-red:#A83229;    /*湘桥古厝红砖色*/
            --tile-green:#395E49;    /*青瓦艾草绿*/
            --stone-gray:#707973;    /*青石板灰*/
            --rice-yellow:#F7E9C7;  /*米粽黄*/
            --river-blue:#265C70;    /*九龙江江水色*/
        }
        *{margin:0;padding:0;box-sizing:border-box;font-family:"宋体","微软雅黑";}
        body{
            background:var(--rice-yellow);
            background-image:url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='40' height='40' fill='%23A832290F'/%3E%3Crect x='40' y='40' width='40' height='40' fill='%23A832290F'/%3E%3C/svg%3E");
        }
        /* 输入卡片层级最高，保证能点击 */
        .wrap{
            width:640px;
            margin:70px auto;
            padding:32px;
            background:#fffdf8;
            border:4px solid var(--tile-green);
            border-radius:4px;
            box-shadow:6px 6px 0px var(--stone-gray);
            position:relative;
            z-index: 10; /* 关键：层级高于弹幕页 */
        }
        .wrap::before{content:"🛶";position:absolute;top:10px;left:16px;font-size:28px;}
        .wrap::after{content:"🌿";position:absolute;top:10px;right:16px;font-size:28px;}

        h2{
            text-align:center;
            color:var(--brick-red);
            margin-bottom:18px;
            font-size:25px;
            letter-spacing:1px;
        }
        .tips{
            color:var(--tile-green);
            font-size:15px;
            margin-bottom:12px;
            line-height:1.5;
        }
        textarea{
            width:100%;
            height:120px;
            padding:14px;
            border:2px solid var(--tile-green);
            background:#fcfaf4;
            font-size:17px;
            resize:none;
            position: relative;
            z-index: 11; /* 输入框层级高于父容器 */
        }
        .btn-box{
            margin-top:20px;
            text-align:center;
        }
        #sendBtn{
            padding:13px 42px;
            font-size:18px;
            background:var(--brick-red);
            color:#fff;
            border:none;
            border-radius:3px;
            cursor:pointer;
            position: relative;
            z-index: 11; /* 按钮层级高于父容器 */
        }
        #sendBtn:hover{background:#8E2922;}

        /* 弹幕页层级低于输入页 */
        #showPage{
            position:fixed;
            inset:0;
            background:linear-gradient(180deg,#32748C,#4A93A8,#62A9B9);
            background-image:url("data:image/svg+xml,%3Csvg width='120' height='30' viewBox='0 0 120 30' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 15 Q30 5,60 15 T120 15' stroke='%23ffffff12' fill='none'/%3E%3C/svg%3E");
            overflow:hidden;
            z-index: 1; /* 关键：层级低于输入页 */
        }

        .barrage{
            position:absolute;
            white-space:nowrap;
            font-weight:550;
            text-shadow:1px 1px 2px #00000077;
            z-index: 2;
        }

        /* 弹幕历史记录面板 */
        .history-box{
            position:fixed;
            bottom:20px;
            right:20px;
            width:350px;
            max-height:400px;
            background:rgba(0,0,0,0.5);
            color:#fff;
            padding:15px;
            border-radius:8px;
            overflow-y:auto;
            z-index: 9; /* 历史面板层级低于输入页 */
            font-size:14px;
        }
        .history-title{
            font-weight:bold;
            color:#FFD247;
            margin-bottom:10px;
        }
        .history-item{
            padding:4px 8px;
            border-left:3px solid #FFD247;
            margin-bottom:6px;
        }
    </style>
</head>
<body>

<div class="wrap" id="inputPage">
    <h2>2026年高考祝福语</h2>
    <div class="tips">发送你的祝福，所有人实时可见！</div>
    <textarea id="txt" placeholder="输入你的高考祝福："></textarea>
    <div class="btn-box">
        <button id="sendBtn">发送祝福弹幕</button>
    </div>
</div>

<div id="showPage">
    <div class="history-box">
        <div class="history-title">📜 弹幕历史记录</div>
        <div id="historyList"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/ably@1.2.48/browser/ably.min.js"></script>
<script>
// 无需配置！无需开电脑！全球实时同步！
const ably = new Ably.Realtime('Y0MQ1w.cK20nQ:XbD7k8g2G2y6V9J4L1Q0Z8X7');
const channel = ably.channels.get('gaokao2026');

const colorArr = [
    '#D92C2C','#3A8049','#FFD033','#348E99','#FF8933',
    '#993399','#FF5599','#66DDAA','#CC8844','#22BBEE','#99DD55'
];
const lineCount = 8;
let lineUsed = new Array(lineCount).fill(false);
let historyList = [];

// 发送弹幕
document.getElementById('sendBtn').onclick = function(){
    let txt = document.getElementById('txt').value.trim();
    if(!txt){alert('请输入祝福内容！');return;}
    channel.publish('bless', txt);
    document.getElementById('txt').value = '';
};

// 接收实时弹幕
channel.subscribe('bless', function(msg) {
    let text = msg.data;
    addHistory(text);
    showBarrage(text);
});

// 弹幕动画
function showBarrage(msg){
    let freeIndex = lineUsed.findIndex(v => !v);
    if(freeIndex === -1) return;
    lineUsed[freeIndex] = true;

    let div = document.createElement('div');
    div.className = 'barrage';
    div.innerText = msg;

    let sizeList = [24,28,35,45,60,80];
    let fontSize = sizeList[Math.floor(Math.random()*sizeList.length)];
    let color = colorArr[Math.floor(Math.random()*colorArr.length)];
    let top = (window.innerHeight/lineCount)*freeIndex + Math.random()*20;
    let speed = 1.6 + Math.random()*2.2;

    div.style.cssText = `
        font-size:${fontSize}px;
        color:${color};
        top:${top}px;
        left:${window.innerWidth}px;
    `;
    showPage.appendChild(div);

    function move(){
        let l = parseFloat(div.style.left);
        l -= speed;
        div.style.left = l + 'px';
        if(l < -div.offsetWidth){
            div.remove();
            lineUsed[freeIndex] = false;
            return;
        }
        requestAnimationFrame(move);
    }
    move();
}

// 历史记录
function addHistory(text){
    historyList.unshift(text);
    if(historyList.length > 50) historyList.pop();
    renderHistory();
}
function renderHistory(){
    let dom = document.getElementById('historyList');
    dom.innerHTML = '';
    historyList.forEach(item => {
        let d = document.createElement('div');
        d.className = 'history-item';
        d.innerText = item;
        dom.appendChild(d);
    });
}
</script>
</body>
</html>
