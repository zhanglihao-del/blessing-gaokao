<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>高考祝福屏</title>
    <style>
        :root {
            --brick-red:#A83229;
            --tile-green:#395E49;
            --stone-gray:#707973;
            --rice-yellow:#F7E9C7;
            --river-blue:#265C70;
        }
        *{margin:0;padding:0;box-sizing:border-box;font-family:"宋体","微软雅黑";}
        body{
            background:var(--rice-yellow);
            background-image:url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='40' height='40' fill='%23A832290F'/%3E%3Crect x='40' y='40' width='40' height='40' fill='%23A832290F'/%3E%3C/svg%3E");
        }
        .wrap{
            width:640px;
            margin:70px auto;
            padding:32px;
            background:#fffdf8;
            border:4px solid var(--tile-green);
            border-radius:4px;
            box-shadow:6px 6px 0px var(--stone-gray);
            position:relative;
        }
        .wrap::before{content:"🛶";position:absolute;top:10px;left:16px;font-size:28px;}
        .wrap::after{content:"🌿";position:absolute;top:10px;right:16px;font-size:28px;}

        h2{
            text-align:center;
            color:var(--brick-red);
            margin-bottom:18px;
            font-size:25px;
            letter-spacing:1px;
        }
        .tips{
            color:var(--tile-green);
            font-size:15px;
            margin-bottom:12px;
            line-height:1.5;
        }
        textarea{
            width:100%;
            height:230px;
            padding:14px;
            border:2px solid var(--tile-green);
            background:#fcfaf4;
            font-size:17px;
            resize:none;
        }
        .btn-box{
            margin-top:20px;
            text-align:center;
        }
        #startBtn{
            padding:13px 42px;
            font-size:18px;
            background:var(--brick-red);
            color:#fff;
            border:none;
            border-radius:3px;
            cursor:pointer;
        }
        #startBtn:hover{background:#8E2922;}

        #showPage{
            display:none;
            position:fixed;
            inset:0;
            background:linear-gradient(180deg,#32748C,#4A93A8,#62A9B9);
            background-image:url("data:image/svg+xml,%3Csvg width='120' height='30' viewBox='0 120 30' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 15 Q30 5,60 15 T120 15' stroke='%23ffffff12' fill='none'/%3E%3C/svg%3E");
            overflow:hidden;
        }
        .back-btn{
            position:fixed;
            top:18px;
            left:18px;
            padding:9px 22px;
            background:#FFD247;
            border:none;
            border-radius:3px;
            font-size:15px;
            cursor:pointer;
            z-index:999;
        }
        .barrage{
            position:absolute;
            white-space:nowrap;
            font-weight:550;
            text-shadow:1px 1px 2px #00000077;
        }
    </style>
</head>
<body>

<div class="wrap" id="inputPage">
    <h2>2026年高考祝福语（全网同步）</h2>
    <div class="tips">一行一条祝福～发送后所有人都能看见！</div>
    <textarea id="txt" placeholder="输入祝福，按回车分隔
例如：
金榜题名
前程似锦
笔下有乾坤，心中存理想"></textarea>
    <div class="btn-box">
        <button id="startBtn" onclick="sendBless()">发送并开启全屏</button>
    </div>
</div>

<div id="showPage">
    <button class="back-btn" onclick="backInput()">← 返回</button>
</div>

<!-- Firebase 核心库 -->
<script src="https://www.gstatic.com/firebasejs/10.0.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.0.2/firebase-database-compat.js"></script>

<script>
// ======================
//  Firebase 配置（免费）
// ======================
const firebaseConfig = {
  apiKey: "AIzaSyD7zH7t3E7mFzJhHVEF83sM1Ea6f8h8p0E",
  authDomain: "barrage-gaokao.firebaseapp.com",
  databaseURL: "https://barrage-gaokao-default-rtdb.firebaseio.com",
  projectId: "barrage-gaokao",
  storageBucket: "barrage-gaokao.appspot.com",
  messagingSenderId: "305055504004",
  appId: "1:305055504004:web:1c2b52b52d1c0d7f6c1a31"
};

// 初始化
if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();

// ======================
//  全局变量
// ======================
const colorArr = [
    '#D92C2C','#3A8049','#FFD033','#348E99','#FF8933',
    '#993399','#FF5599','#66DDAA','#CC8844','#22BBEE','#99DD55'
];
const lineCount = 8;
let lineUsed = new Array(lineCount).fill(false);
const inputPage = document.getElementById('inputPage');
const showPage = document.getElementById('showPage');

// ======================
//  发送祝福到云端
// ======================
function sendBless(){
    let val = document.getElementById('txt').value.trim();
    if(!val){alert('请填写祝福');return;}
    
    let list = val.split('\n').filter(i=>i.trim());
    list.forEach(text => {
        db.ref('bless').push({
            text: text,
            time: Date.now()
        });
    });
    
    inputPage.style.display = 'none';
    showPage.style.display = 'block';
    listenAllBless(); // 开始监听所有人的祝福
}

// ======================
//  监听实时弹幕
// ======================
function listenAllBless(){
    db.ref('bless').on('child_added', (snapshot) => {
        let data = snapshot.val();
        if(data?.text) {
            createSingleBarrage(data.text);
        }
    });
}

// ======================
//  创建单条弹幕动画
// ======================
function createSingleBarrage(msg){
    let freeIndex = lineUsed.findIndex(v => !v);
    if(freeIndex === -1) return;
    lineUsed[freeIndex] = true;

    let div = document.createElement('div');
    div.className = 'barrage';
    div.innerText = msg;

    let sizeList = [24,28,35,45,60,80];
    let fontSize = sizeList[Math.floor(Math.random()*sizeList.length)];
    let color = colorArr[Math.floor(Math.random()*colorArr.length)];
    let top = (window.innerHeight / lineCount * freeIndex) + Math.random()*20;
    let speed = 1.6 + Math.random()*2.2;

    div.style.cssText = `
        font-size:${fontSize}px;
        color:${color};
        top:${top}px;
        left:${window.innerWidth}px;
    `;

    showPage.appendChild(div);

    function move(){
        let left = parseFloat(div.style.left);
        left -= speed;
        div.style.left = left + 'px';
        if(left < -div.offsetWidth){
            div.remove();
            lineUsed[freeIndex] = false;
            return;
        }
        requestAnimationFrame(move);
    }
    move();
}

// ======================
//  返回输入页
// ======================
function backInput(){
    showPage.style.display = 'none';
    inputPage.style.display = 'block';
}
</script>
</body>
</html>
