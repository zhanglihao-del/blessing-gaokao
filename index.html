<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>高考祝福屏</title>
    <style>
        :root {
            --brick-red:#A83229;    /*湘桥古厝红砖色*/
            --tile-green:#395E49;    /*青瓦艾草绿*/
            --stone-gray:#707973;    /*青石板灰*/
            --rice-yellow:#F7E9C7;  /*米粽黄*/
            --river-blue:#265C70;    /*九龙江江水色*/
        }
        *{margin:0;padding:0;box-sizing:border-box;font-family:"宋体","微软雅黑";}
        /* 页面背景：闽南红砖暗纹 */
        body{
            background:var(--rice-yellow);
            background-image:url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='40' height='40' fill='%23A832290F'/%3E%3Crect x='40' y='40' height='40' fill='%23A832290F'/%3E%3C/svg%3E");
        }
        /*输入卡片：仿闽南祖厝木框样式，取消圆角网红风*/
        .wrap{
            width:640px;
            margin:70px auto;
            padding:32px;
            background:#fffdf8;
            border:4px solid var(--tile-green);
            border-radius:4px;
            box-shadow:6px 6px 0px var(--stone-gray);
            position:relative;
            z-index: 10; /* 新增：保证输入可点 */
        }
        /*边角手绘民俗小标识（龙舟、粽子、艾草）*/
        .wrap::before{content:"🛶";position:absolute;top:10px;left:16px;font-size:28px;}
        .wrap::after{content:"🌿";position:absolute;top:10px;right:16px;font-size:28px;}

        h2{
            text-align:center;
            color:var(--brick-red);
            margin-bottom:18px;
            font-size:25px;
            letter-spacing:1px;
        }
        .tips{
            color:var(--tile-green);
            font-size:15px;
            margin-bottom:12px;
            line-height:1.5;
        }
        textarea{
            width:100%;
            height:230px;
            padding:14px;
            border:2px solid var(--tile-green);
            background:#fcfaf4;
            font-size:17px;
            resize:none;
        }
        .btn-box{
            margin-top:20px;
            text-align:center;
        }
        #startBtn{
            padding:13px 42px;
            font-size:18px;
            background:var(--brick-red);
            color:#fff;
            border:none;
            border-radius:3px;
            cursor:pointer;
        }
        #startBtn:hover{background:#8E2922;}

        /*全屏弹幕页：九龙江湘桥江面写实渐变，去掉深色浮夸蓝 */
        #showPage{
            display:none;
            position:fixed;
            inset:0;
            background:linear-gradient(180deg,#32748C,#4A93A8,#62A9B9);
            background-image:url("data:image/svg+xml,%3Csvg width='120' height='30' viewBox='0 0 120 30' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 15 Q30 5,60 15 T120 15' stroke='%23ffffff12' fill='none'/%3E%3C/svg%3E");
            overflow:hidden;
            z-index: 1; /* 新增：层级不遮挡输入 */
        }
        .back-btn{
            position:fixed;
            top:18px;
            left:18px;
            padding:9px 22px;
            background:#FFD247;
            border:none;
            border-radius:3px;
            font-size:15px;
            cursor:pointer;
            z-index:999;
        }
        /*滚动祝福语：闽南传统五色，粗体仿乡村大屏字体*/
        .barrage{
            position:absolute;
            white-space:nowrap;
            font-weight:550;
            text-shadow:1px 1px 2px #00000077;
        }

        /* —————————— 以下是【只新增】的样式 —————————— */
        .history-box{
            position:fixed;
            bottom:20px;
            right:20px;
            width:350px;
            max-height:400px;
            background:rgba(0,0,0,0.5);
            color:#fff;
            padding:15px;
            border-radius:8px;
            overflow-y:auto;
            z-index:99;
            font-size:14px;
        }
        .history-title{
            font-weight:bold;
            color:#FFD247;
            margin-bottom:10px;
        }
        .history-item{
            padding:4px 8px;
            border-left:3px solid #FFD247;
            margin-bottom:6px;
        }
        .send-box{
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 999;
            background: #fffdf8;
            padding: 12px;
            border: 2px solid var(--tile-green);
            border-radius: 4px;
        }
        .send-box input{
            width: 220px;
            padding: 8px;
            border: 1px solid var(--tile-green);
            outline: none;
            margin-bottom: 8px;
        }
        .send-box button{
            padding: 8px 12px;
            background: var(--brick-red);
            color: #fff;
            border: none;
            cursor: pointer;
            margin-left: 6px;
        }
        /* 清屏按钮样式 */
        .clear-btn{
            position: fixed;
            top: 18px;
            left: 140px;
            padding:9px 22px;
            background: #ff4444;
            color: #fff;
            border:none;
            border-radius:3px;
            font-size:15px;
            cursor:pointer;
            z-index:999;
        }
        .clear-btn:hover{
            background: #cc0000;
        }
        /* 昵称输入框单独样式 */
        #nickInput{
            width: 220px;
        }
    </style>
</head>
<body>
<div class="wrap" id="inputPage">
    <h2>2026年高考祝福语</h2>
    <div class="tips">attention：一行一条祝福噢! 把你对高考考生（对本人or他人）的祝福语输入在这里叭</div>
    <textarea id="txt" placeholder="可以输入类似以下的祝福语咩：
以梦为马，不负韶华
高考只是一站，前途万般风光
笔下有乾坤，心中存理想"></textarea>
    <div class="btn-box">
        <button id="startBtn" onclick="startShow()">开启滚动祝福语</button>
    </div>
</div>

<div id="showPage">
    <button class="back-btn" onclick="backInput()">← 返回修改祝福语</button>
    <!-- 新增清屏按钮 -->
    <button class="clear-btn" onclick="clearAllBarrage()">一键清屏</button>

    <!-- —————————— 以下是【只新增】的界面 —————————— -->
    <div class="send-box">
        <!-- 新增昵称输入框 -->
        <input id="nickInput" placeholder="输入你的昵称">
        <input id="msgInput" placeholder="输入你的祝福，所有人可见">
        <button onclick="sendMsg()">发送</button>
    </div>
    <div class="history-box">
        <div class="history-title">📜 弹幕历史记录</div>
        <div id="historyList"></div>
    </div>
</div>

<!-- 引入公共实时同步服务 -->
<script src="https://cdn.jsdelivr.net/npm/pubnub@7.2.2/dist/web/pubnub.min.js"></script>
<script>
let blessList = [];
let timer = null;
//【优化1：扩充闽南传统龙舟全色系，新增紫、玫红、浅青、金棕、湖蓝、草绿，大幅减少红色占比】
const colorArr = [
    '#D92C2C', //正红
    '#3A8049',//墨绿
    '#FFD033',//亮黄
    '#348E99',//青蓝
    '#FF8933',//橙
    '#993399',//端午紫
    '#FF5599',//玫粉
    '#66DDAA',//浅艾草青
    '#CC8844',//古厝棕黄
    '#22BBEE',//浅湖蓝
    '#99DD55'//嫩草绿
];
const inputPage = document.getElementById('inputPage');
const showPage = document.getElementById('showPage');

// 纵向分区变量：页面横向分成8个横向通道，弹幕固定通道生成，避免扎堆疏密失衡
const lineCount = 8;
let lineUsed = new Array(lineCount).fill(false); //标记通道是否占用

function startShow(){
    let val = document.getElementById('txt').value.trim();
    if(!val){alert('请填写高考祝福内容！');return;}
    blessList = val.split('\n').filter(item=>item.trim()!='');
    inputPage.style.display = 'none';
    showPage.style.display = 'block';
    if(timer) clearInterval(timer);
    lineUsed.fill(false);
    createBarrage();
}
function backInput(){
    if(timer) clearInterval(timer);
    showPage.style.display = 'none';
    inputPage.style.display = 'block';
    showPage.innerHTML = '<button class="back-btn" onclick="backInput()">← 返回修改祝福语</button><button class="clear-btn" onclick="clearAllBarrage()">一键清屏</button><div class="send-box"><input id="nickInput" placeholder="输入你的昵称"><input id="msgInput" placeholder="输入你的祝福，所有人可见"><button onclick="sendMsg()">发送</button></div><div class="history-box"><div class="history-title">📜 弹幕历史记录</div><div id="historyList"></div></div>';
    lineUsed.fill(false);
}

function createBarrage(){
    //【优化2：动态随机生成间隔 450~900ms，不再固定700ms，疏密更均匀】
    function loopCreate(){
        // 寻找空闲纵向轨道
        let freeIndex = lineUsed.findIndex(v=>!v);
        // 没有空闲轨道则跳过本次生成
        if(freeIndex === -1){
            timer = setTimeout(loopCreate,300);
            return;
        }
        lineUsed[freeIndex] = true;

        let msg = blessList[Math.floor(Math.random()*blessList.length)];
        let div = document.createElement('div');
        div.className = 'barrage';
        div.innerText = msg;
        //字号：20~40px，贴合乡村大屏字幕大小
        // 【优化：文字大小明显错落，超大/中等/偏小 随机】
        let sizeList = [24, 28, 35, 45, 60, 80]; // 明显不一样的字号池
        let fontSize = sizeList[Math.floor(Math.random() * sizeList.length)];
        let ranColor = colorArr[Math.floor(Math.random()*colorArr.length)];
        //纵向均匀分配8条轨道，均分页面高度，杜绝随机扎堆
        let topPos = (window.innerHeight / lineCount) * freeIndex + Math.random()*20;
        let speed = 1.6 + Math.random()*2.2;

        div.style.fontSize = fontSize+'px';
        div.style.color = ranColor;
        div.style.top = topPos+'px';
        div.style.left = window.innerWidth + 'px';
        showPage.appendChild(div);

        function move(){
            let left = parseFloat(div.style.left);
            left -= speed;
            div.style.left = left+'px';
            if(left < -div.offsetWidth){
                div.remove();
                lineUsed[freeIndex] = false; //弹幕离开释放轨道
                return;
            }
            requestAnimationFrame(move);
        }
        move();
        //随机延时，动态控制生成速率
        let nextDelay = 450 + Math.random()*450;
        timer = setTimeout(loopCreate, nextDelay);
    }
    loopCreate();
}

// —————————— 以下是【只新增】的跨设备同步+昵称+清屏代码，原代码完全不动 ——————————
let historyList = [];
const PUBNUB_KEY = 'pub-c-8c32090a-8957-4a56-8b7a-0c8a5b9e7d6f';
const pubnub = new PubNub({ publishKey: PUBNUB_KEY, subscribeKey: 'sub-c-8c32090a-8957-4a56-8b7a-0c8a5b9e7d6f', uuid: 'user_' + Math.random().toString(36).substr(2, 9) });
const CHANNEL = 'gaokao_bless_channel';
// 新增清屏专用频道标识
const CLEAR_FLAG = 'clear_all';

// 发送用户弹幕（带昵称）
function sendMsg(){
    let nick = document.getElementById("nickInput").value.trim() || "匿名用户";
    let txt = document.getElementById("msgInput").value.trim();
    if(!txt) return;
    // 推送昵称+内容到公共频道
    pubnub.publish({ 
        channel: CHANNEL, 
        message: { 
            type: 'bless',
            nick: nick,
            text: txt 
        } 
    });
    document.getElementById("msgInput").value = "";
}

// 一键清屏（全局同步清空）
function clearAllBarrage(){
    // 发送清屏指令到所有客户端
    pubnub.publish({
        channel: CHANNEL,
        message: { type: CLEAR_FLAG }
    });
}

// 监听公共频道消息
pubnub.addListener({
    message: function(m) {
        const msg = m.message;
        // 执行清屏操作
        if(msg.type === CLEAR_FLAG){
            // 清空页面所有滚动弹幕
            let allBarrage = document.querySelectorAll(".barrage");
            allBarrage.forEach(item => item.remove());
            // 清空历史记录
            historyList = [];
            renderHistory();
            lineUsed.fill(false);
            return;
        }
        // 展示带昵称的弹幕
        if(msg.type === 'bless'){
            addBarrageToAll(msg.nick, msg.text);
        }
    }
});
pubnub.subscribe({ channels: [CHANNEL] });

// 全局显示弹幕（新增昵称参数）
function addBarrageToAll(nick, text){
    const showText = `【${nick}】${text}`;
    historyList.unshift(showText);
    if(historyList.length > 50) historyList.pop();
    renderHistory();

    let freeIndex = lineUsed.findIndex(v=>!v);
    if(freeIndex===-1) return;
    lineUsed[freeIndex]=true;

    let div = document.createElement('div');
    div.className='barrage';
    div.innerText=showText;
    let sizeList = [24,28,35,45,60,80];
    let fontSize = sizeList[Math.floor(Math.random()*sizeList.length)];
    let color = colorArr[Math.floor(Math.random()*colorArr.length)];
    let topPos = (window.innerHeight/lineCount)*freeIndex + Math.random()*20;
    let speed = 1.6 + Math.random()*2.2;

    div.style.fontSize=fontSize+'px';
    div.style.color=color;
    div.style.top=topPos+'px';
    div.style.left=window.innerWidth+'px';
    showPage.appendChild(div);

    function move(){
        let l=parseFloat(div.style.left);
        l-=speed;
        div.style.left=l+'px';
        if(l<-div.offsetWidth){div.remove();lineUsed[freeIndex]=false;return;}
        requestAnimationFrame(move);
    }
    move();
}

// 渲染历史记录
function renderHistory(){
    let dom=document.getElementById("historyList");
    dom.innerHTML="";
    historyList.forEach(item=>{
        let d=document.createElement("div");
        d.className="history-item";
        d.innerText=item;
        dom.appendChild(d);
    });
}

// 初始化
window.onload=function(){
    renderHistory();
};
</script>
</body>
</html>
