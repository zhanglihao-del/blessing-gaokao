<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>高考祝福屏</title>
    <style>
        :root {
            --brick-red:#A83229;    /*湘桥古厝红砖色*/
            --tile-green:#395E49;    /*青瓦艾草绿*/
            --stone-gray:#707973;    /*青石板灰*/
            --rice-yellow:#F7E9C7;  /*米粽黄*/
            --river-blue:#265C70;    /*九龙江江水色*/
        }
        *{margin:0;padding:0;box-sizing:border-box;font-family:"宋体","微软雅黑";}
        /* 页面背景：闽南红砖暗纹 */
        body{
            background:var(--rice-yellow);
            background-image:url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='40' height='40' fill='%23A832290F'/%3E%3Crect x='40' y='40' width='40' height='40' fill='%23A832290F'/%3E%3C/svg%3E");
        }
        /*输入卡片：仿闽南祖厝木框样式，取消圆角网红风*/
        .wrap{
            width:640px;
            margin:70px auto;
            padding:32px;
            background:#fffdf8;
            border:4px solid var(--tile-green);
            border-radius:4px;
            box-shadow:6px 6px 0px var(--stone-gray);
            position:relative;
        }
        /*边角手绘民俗小标识（龙舟、粽子、艾草）*/
        .wrap::before{content:"🛶";position:absolute;top:10px;left:16px;font-size:28px;}
        .wrap::after{content:"🌿";position:absolute;top:10px;right:16px;font-size:28px;}

        h2{
            text-align:center;
            color:var(--brick-red);
            margin-bottom:18px;
            font-size:25px;
            letter-spacing:1px;
        }
        .tips{
            color:var(--tile-green);
            font-size:15px;
            margin-bottom:12px;
            line-height:1.5;
        }
        textarea{
            width:100%;
            height:230px;
            padding:14px;
            border:2px solid var(--tile-green);
            background:#fcfaf4;
            font-size:17px;
            resize:none;
        }
        .btn-box{
            margin-top:20px;
            text-align:center;
        }
        #startBtn{
            padding:13px 42px;
            font-size:18px;
            background:var(--brick-red);
            color:#fff;
            border:none;
            border-radius:3px;
            cursor:pointer;
        }
        #startBtn:hover{background:#8E2922;}

        /*全屏弹幕页：九龙江湘桥江面写实渐变，去掉深色浮夸蓝 */
        #showPage{
            display:none;
            position:fixed;
            inset:0;
            background:linear-gradient(180deg,#32748C,#4A93A8,#62A9B9);
            background-image:url("data:image/svg+xml,%3Csvg width='120' height='30' viewBox='0 0 120 30' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 15 Q30 5,60 15 T120 15' stroke='%23ffffff12' fill='none'/%3E%3C/svg%3E");
            overflow:hidden;
        }
        .back-btn{
            position:fixed;
            top:18px;
            left:18px;
            padding:9px 22px;
            background:#FFD247;
            border:none;
            border-radius:3px;
            font-size:15px;
            cursor:pointer;
            z-index:999;
        }
        /*滚动祝福语：闽南传统五色，粗体仿乡村大屏字体*/
        .barrage{
            position:absolute;
            white-space:nowrap;
            font-weight:550;
            text-shadow:1px 1px 2px #00000077;
        }
    </style>
</head>
<body>
<div class="wrap" id="inputPage">
    <h2>2026年高考祝福语</h2>
    <div class="tips">attention：一行一条祝福噢! 把你对高考考生（对本人or他人）的祝福语输入在这里叭</div>
    <textarea id="txt" placeholder="可以输入类似以下的祝福语咩：
以梦为马，不负韶华
高考只是一站，前途万般风光
笔下有乾坤，心中存理想"></textarea>
    <div class="btn-box">
        <button id="startBtn" onclick="startShow()">开启滚动祝福语</button>
    </div>
</div>

<div id="showPage">
    <button class="back-btn" onclick="backInput()">← 返回修改祝福语</button>
</div>

<!-- 引入 Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ===================== 你提供的 Supabase 配置 =====================
const SUPABASE_URL = "https://cyanonionladoqxqrn.supabase.co";
const SUPABASE_KEY = "sb_publishable_5GrcHRNKio5d09cI7IkQ3A_eaugq3_a";

// 创建 supabase 客户端
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ===================== 你原来的所有代码 完全不变 =====================
let blessList = [];
let timer = null;
//【优化1：扩充闽南传统龙舟全色系，新增紫、玫红、浅青、金棕、湖蓝、草绿，大幅减少红色占比】
const colorArr = [
    '#D92C2C', //正红
    '#3A8049',//墨绿
    '#FFD033',//亮黄
    '#348E99',//青蓝
    '#FF8933',//橙
    '#993399',//端午紫
    '#FF5599',//玫粉
    '#66DDAA',//浅艾草青
    '#CC8844',//古厝棕黄
    '#22BBEE',//浅湖蓝
    '#99DD55'//嫩草绿
];
const inputPage = document.getElementById('inputPage');
const showPage = document.getElementById('showPage');

// 纵向分区变量：页面横向分成8个横向通道，弹幕固定通道生成，避免扎堆疏密失衡
const lineCount = 8;
let lineUsed = new Array(lineCount).fill(false); //标记通道是否占用

// ===================== 修复版：发送弹幕 + 同步（增加错误处理） =====================
async function startShow(){
    let val = document.getElementById('txt').value.trim();
    if(!val){alert('请填写高考祝福内容！');return;}
    
    // 本地解析
    let localList = val.split('\n').filter(item=>item.trim()!='');

    // 先加载历史弹幕（加try-catch，防止网络错误卡死）
    try {
        const { data } = await supabase.from('barrages').select('content');
        if(data) blessList = data.map(item => item.content);
    } catch (e) {
        console.error('加载历史弹幕失败：', e);
        blessList = [];
    }

    // 把输入的弹幕上传到云端（加try-catch，防止上传失败卡住）
    for(let msg of localList) {
        try {
            await supabase.from('barrages').insert([{ content: msg }]);
        } catch (e) {
            console.error('上传弹幕失败：', msg, e);
        }
        // 同时加入本地列表，保证本地一定能显示
        if(!blessList.includes(msg)) blessList.push(msg);
    }
    
    inputPage.style.display = 'none';
    showPage.style.display = 'block';
    if(timer) clearInterval(timer);
    lineUsed.fill(false);
    
    // 开启实时监听
    listenRealtimeBarrage();
    createBarrage();
}

function backInput(){
    if(timer) clearInterval(timer);
    showPage.style.display = 'none';
    inputPage.style.display = 'block';
    showPage.innerHTML = '<button class="back-btn" onclick="backInput()">← 返回修改祝福语</button>';
    lineUsed.fill(false);
}

// ===================== 弹幕创建函数 完全不变 =====================
function createBarrage(){
    function loopCreate(){
        let freeIndex = lineUsed.findIndex(v=>!v);
        if(freeIndex === -1){
            timer = setTimeout(loopCreate,300);
            return;
        }
        lineUsed[freeIndex] = true;

        let msg = blessList[Math.floor(Math.random()*blessList.length)];
        let div = document.createElement('div');
        div.className = 'barrage';
        div.innerText = msg;
        let sizeList = [24, 28, 35, 45, 60, 80];
        let fontSize = sizeList[Math.floor(Math.random() * sizeList.length)];
        let ranColor = colorArr[Math.floor(Math.random()*colorArr.length)];
        let topPos = (window.innerHeight / lineCount) * freeIndex + Math.random()*20;
        let speed = 1.6 + Math.random()*2.2;

        div.style.fontSize = fontSize+'px';
        div.style.color = ranColor;
        div.style.top = topPos+'px';
        div.style.left = window.innerWidth + 'px';
        showPage.appendChild(div);

        function move(){
            let left = parseFloat(div.style.left);
            left -= speed;
            div.style.left = left+'px';
            if(left < -div.offsetWidth){
                div.remove();
                lineUsed[freeIndex] = false;
                return;
            }
            requestAnimationFrame(move);
        }
        move();
        let nextDelay = 450 + Math.random()*450;
        timer = setTimeout(loopCreate, nextDelay);
    }
    loopCreate();
}

// ===================== 新增：实时弹幕同步（所有人互通） =====================
async function listenRealtimeBarrage() {
    supabase.channel('public:barrages')
        .on('postgres_changes', {
            event: 'INSERT',
            schema: 'public',
            table: 'barrages'
        }, (payload) => {
            let newMsg = payload.new.content;
            if(!blessList.includes(newMsg)) {
                blessList.push(newMsg);
            }
        })
        .subscribe();
}
</script>
</body>
</html>
