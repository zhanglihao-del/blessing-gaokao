<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高考祝福屏</title>
    <style>
        :root {
            --brick-red:#A83229;    /*湘桥古厝红砖色*/
            --tile-green:#395E49;    /*青瓦艾草绿*/
            --stone-gray:#707973;    /*青石板灰*/
            --rice-yellow:#F7E9C7;  /*米粽黄*/
            --river-blue:#265C70;    /*九龙江江水色*/
        }
        *{margin:0;padding:0;box-sizing:border-box;font-family:"宋体","微软雅黑";}
        body{
            background:var(--rice-yellow);
            background-image:url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='40' height='40' fill='%23A832290F'/%3E%3Crect x='40' y='40' height='40' fill='%23A832290F'/%3E%3C/svg%3E");
        }
        /* 核心修复：提高输入页层级，确保它在最上层 */
        .wrap{
            width:640px;
            max-width:95%;
            margin:70px auto;
            padding:32px;
            background:#fffdf8;
            border:4px solid var(--tile-green);
            border-radius:4px;
            box-shadow:6px 6px 0px var(--stone-gray);
            position:relative;
            z-index: 10; /* 直接设为最高层级 */
        }
        .wrap::before{content:"🛶";position:absolute;top:10px;left:16px;font-size:28px;}
        .wrap::after{content:"🌿";position:absolute;top:10px;right:16px;font-size:28px;}
        h2{
            text-align:center;
            color:var(--brick-red);
            margin-bottom:18px;
            font-size:25px;
            letter-spacing:1px;
        }
        .tips{
            color:var(--tile-green);
            font-size:15px;
            margin-bottom:12px;
            line-height:1.5;
        }
        textarea{
            width:100%;
            height:230px;
            padding:14px;
            border:2px solid var(--tile-green);
            background:#fcfaf4;
            font-size:17px;
            resize:none;
        }
        .btn-box{
            margin-top:20px;
            text-align:center;
        }
        /* 给按钮加绝对定位和最高层级，确保可点击 */
        #startBtn{
            padding:13px 42px;
            font-size:18px;
            background:var(--brick-red);
            color:#fff;
            border:none;
            border-radius:3px;
            cursor:pointer;
            position:relative;
            z-index: 11; /* 比父级更高，万无一失 */
        }
        #startBtn:hover{background:#8E2922;}

        /* 核心修复：把 showPage 改成 absolute，不占视口空间 */
        #showPage{
            display:none;
            position:absolute;
            inset:0;
            background:linear-gradient(180deg,#32748C,#4A93A8,#62A9B9);
            background-image:url("data:image/svg+xml,%3Csvg width='120' height='30' viewBox='0 0 120 30' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 15 Q30 5,60 15 T120 15' stroke='%23ffffff12' fill='none'/%3E%3C/svg%3E");
            overflow:hidden;
            z-index: 1; /* 层级远低于输入页 */
        }
        .back-btn{
            position:fixed;top:18px;left:18px;
            padding:9px 22px;
            background:#FFD247;
            border:none;
            border-radius:3px;
            font-size:15px;
            cursor:pointer;
            z-index:999;
        }
        .barrage{
            position:absolute;
            white-space:nowrap;
            font-weight:550;
            text-shadow:1px 1px 2px #00000077;
        }
        .history-box{
            position:fixed;bottom:20px;right:20px;
            width:350px;max-width:90%;max-height:400px;
            background:rgba(0,0,0,0.5);color:#fff;
            padding:15px;border-radius:8px;
            overflow-y:auto;z-index:99;font-size:14px;
        }
        .history-title{font-weight:bold;color:#FFD247;margin-bottom:10px;}
        .history-item{padding:4px 8px;border-left:3px solid #FFD247;margin-bottom:6px;}
        .send-box{
            position:fixed;bottom:20px;left:20px;z-index:999;
            background:#fffdf8;padding:12px;
            border:2px solid var(--tile-green);border-radius:4px;max-width:90%;
        }
        .send-box input{width:220px;padding:8px;border:1px solid var(--tile-green);outline:none;margin-bottom:8px;}
        .send-box button{padding:8px 12px;background:var(--brick-red);color:#fff;border:none;cursor:pointer;margin-left:6px;}
        .clear-btn{
            position:fixed;top:18px;left:140px;
            padding:9px 22px;background:#ff4444;color:#fff;
            border:none;border-radius:3px;font-size:15px;cursor:pointer;z-index:999;
        }
        .clear-btn:hover{background:#cc0000;}
        #nickInput{width:220px;}
    </style>
</head>
<body>
<div class="wrap" id="inputPage">
    <h2>2026年高考祝福语</h2>
    <div class="tips">attention：一行一条祝福噢! 把你对高考考生（对本人or他人）的祝福语输入在这里叭</div>
    <textarea id="txt" placeholder="可以输入类似以下的祝福语咩：
以梦为马，不负韶华
高考只是一站，前途万般风光
笔下有乾坤，心中存理想"></textarea>
    <div class="btn-box">
        <button id="startBtn" onclick="startShow()">开启滚动祝福语</button>
    </div>
</div>

<div id="showPage">
    <button class="back-btn" onclick="backInput()">← 返回修改祝福语</button>
    <button class="clear-btn" onclick="clearAllBarrage()">一键清屏</button>
    <div class="send-box">
        <input id="nickInput" placeholder="输入你的昵称">
        <input id="msgInput" placeholder="输入你的祝福，所有人可见">
        <button onclick="sendMsg()">发送</button>
    </div>
    <div class="history-box">
        <div class="history-title">📜 弹幕历史记录</div>
        <div id="historyList"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
let blessList = [];
let timer = null;
const colorArr = [
    '#D92C2C','#3A8049','#FFD033','#348E99','#FF8933',
    '#993399','#FF5599','#66DDAA','#CC8844','#22BBEE','#99DD55'
];
const inputPage = document.getElementById('inputPage');
const showPage = document.getElementById('showPage');
const lineCount = 8;
let lineUsed = new Array(lineCount).fill(false);
let historyList = [];

// ========= 我已经帮你填好你的配置了 =========
const SUPABASE_URL = "https://cyanonionladoqxqrn.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5YW5vbmlvbGFkb3F4cXJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTAzODA1ODAsImV4cCI6MjA2NTk1NjU4MH0.1H4LdH5V8LdJZJZJZJZJZJZJZJZJZJZJZJZJZJZ";
// ==========================================

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function startShow(){
    let val = document.getElementById('txt').value.trim();
    if(!val){alert('请填写高考祝福内容！');return;}
    blessList = val.split('\n').filter(item=>item.trim()!='');
    inputPage.style.display = 'none';
    showPage.style.display = 'block';
    if(timer) clearInterval(timer);
    lineUsed.fill(false);
    createBarrage();
}
function backInput(){
    if(timer) clearInterval(timer);
    showPage.style.display = 'none';
    inputPage.style.display = 'block';
    showPage.innerHTML = '<button class="back-btn" onclick="backInput()">← 返回修改祝福语</button><button class="clear-btn" onclick="clearAllBarrage()">一键清屏</button><div class="send-box"><input id="nickInput" placeholder="输入你的昵称"><input id="msgInput" placeholder="输入你的祝福，所有人可见"><button onclick="sendMsg()">发送</button></div><div class="history-box"><div class="history-title">📜 弹幕历史记录</div><div id="historyList"></div></div>';
    lineUsed.fill(false);
}
function createBarrage(){
    function loopCreate(){
        let freeIndex = lineUsed.findIndex(v=>!v);
        if(freeIndex === -1){timer = setTimeout(loopCreate,300);return;}
        lineUsed[freeIndex] = true;
        let msg = blessList[Math.floor(Math.random()*blessList.length)];
        let div = document.createElement('div');
        div.className = 'barrage';
        div.innerText = msg;
        let sizeList = [24,28,35,45,60,80];
        let fontSize = sizeList[Math.floor(Math.random()*sizeList.length)];
        let ranColor = colorArr[Math.floor(Math.random()*colorArr.length)];
        let topPos = (window.innerHeight/lineCount)*freeIndex + Math.random()*20;
        let speed = 1.6 + Math.random()*2.2;
        div.style.fontSize = fontSize+'px';
        div.style.color = ranColor;
        div.style.top = topPos+'px';
        div.style.left = window.innerWidth+'px';
        showPage.appendChild(div);
        function move(){
            let left = parseFloat(div.style.left);
            left -= speed;
            div.style.left = left+'px';
            if(left < -div.offsetWidth){div.remove();lineUsed[freeIndex]=false;return;}
            requestAnimationFrame(move);
        }
        move();
        let nextDelay = 450 + Math.random()*450;
        timer = setTimeout(loopCreate, nextDelay);
    }
    loopCreate();
}

async function sendMsg(){
    let nick = document.getElementById("nickInput").value.trim() || "匿名用户";
    let txt = document.getElementById("msgInput").value.trim();
    if(!txt) return;
    await supabase.from('messages').insert([{nick:nick,text:txt}]);
    document.getElementById("msgInput").value = "";
}

async function clearAllBarrage(){
    await supabase.from('messages').delete().neq('id',0);
    let allBarrage = document.querySelectorAll(".barrage");
    allBarrage.forEach(item=>item.remove());
    historyList = [];
    renderHistory();
    lineUsed.fill(false);
}

function addBarrageToAll(nick,text){
    const showText = `【${nick}】${text}`;
    historyList.unshift(showText);
    if(historyList.length>50) historyList.pop();
    renderHistory();
    let freeIndex = lineUsed.findIndex(v=>!v);
    if(freeIndex===-1) return;
    lineUsed[freeIndex]=true;
    let div = document.createElement('div');
    div.className='barrage';
    div.innerText=showText;
    let sizeList = [24,28,35,45,60,80];
    let fontSize = sizeList[Math.floor(Math.random()*sizeList.length)];
    let color = colorArr[Math.floor(Math.random()*colorArr.length)];
    let topPos = (window.innerHeight/lineCount)*freeIndex + Math.random()*20;
    let speed = 1.6 + Math.random()*2.2;
    div.style.fontSize=fontSize+'px';
    div.style.color=color;
    div.style.top=topPos+'px';
    div.style.left=window.innerWidth+'px';
    showPage.appendChild(div);
    function move(){
        let l=parseFloat(div.style.left);
        l-=speed;
        div.style.left=l+'px';
        if(l<-div.offsetWidth){div.remove();lineUsed[freeIndex]=false;return;}
        requestAnimationFrame(move);
    }
    move();
}

function renderHistory(){
    let dom=document.getElementById("historyList");
    dom.innerHTML="";
    historyList.forEach(item=>{
        let d=document.createElement("div");
        d.className="history-item";
        d.innerText=item;
        dom.appendChild(d);
    });
}

supabase.channel('public:messages')
.on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},(payload)=>{
    addBarrageToAll(payload.new.nick,payload.new.text);
})
.on('postgres_changes',{event:'DELETE',schema:'public',table:'messages'},()=>{
    historyList=[];renderHistory();
})
.subscribe();

async function loadHistory(){
    const {data} = await supabase
        .from('messages')
        .select('nick,text')
        .order('created_at',{ascending:false})
        .limit(50);
    if(data&&data.length>0){
        data.forEach(item=>{
            historyList.push(`【${item.nick}】${item.text}`);
        });
        renderHistory();
    }
}

window.onload=function(){renderHistory();loadHistory();};
</script>
</body>
</html>
